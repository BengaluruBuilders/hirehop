<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 Sign in with Google</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A5C}a:hover{color:#064D3A}
button,input{font-family:inherit}
</style>
</helmet>
<main style="width: 360px; height: 800px; position: relative; overflow: hidden; box-sizing: border-box; background: #FFFFFF; color: #16181D; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="position: relative; background: #0B7A5C; color: #FFFFFF; border-radius: 0 0 48px 48px; padding: 36px 16px 28px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
<svg style="position: absolute; right: 24px; top: 168px" width="34" height="34" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M15 4c6.5 0 11 4.6 11 10.8S21.3 26 15.2 26 4 21.5 4 15.3C4 9.6 8 5.6 13 4.6" stroke="#FFC94D" stroke-width="3" stroke-linecap="round"/></svg>
<svg style="position: absolute; right: 120px; top: 52px" width="56" height="16" viewBox="0 0 64 18" fill="none" aria-hidden="true"><path d="M2 11C7 3 12 3 16 9s9 7 13 1 9-7 13-1 9 7 13 1 6-5 7-4" stroke="#F3A08E" stroke-width="3" stroke-linecap="round"/></svg>
<svg style="position: absolute; right: 28px; bottom: 30px" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><circle cx="6" cy="7" r="3.5" fill="#FFFFFF"/><circle cx="20" cy="7" r="3.5" fill="#FFFFFF"/><circle cx="34" cy="7" r="3.5" fill="#FFFFFF"/></svg>
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
<a href="S2b-Paste-Pasted.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
<span style="height: 32px; padding: 0 14px; border-radius: 999px; background: #064D3A; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">Step 2 of 5</span>
</div>
<div style="height: 72px; border-radius: 36px; background: #FFFFFF; color: #16181D; display: flex; align-items: center; gap: 12px; padding: 0 12px; box-sizing: border-box; margin-right: 56px">
<span style="width: 48px; height: 48px; border-radius: 999px; background: #0B7A5C; color: #FFFFFF; flex: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">KP</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 800">Product Analyst</span><span style="font-size: 12px; font-weight: 600; color: #5F6672">Kestrel Pay · ready to check</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.5px">Save your fit check</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #DDF2EA">Sign in so this job post and your facts stay with you.</p>
</div>
</header>

<div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; align-items: center; gap: 14px; min-height: 76px; border-radius: 28px; background: #F6F7F9; border: 1px solid #E6E8EC; padding: 14px; box-sizing: border-box; cursor: pointer">
<input type="checkbox" checked="{{adult}}" onChange="{{toggle}}" style="width: 26px; height: 26px; margin: 0; flex: none; accent-color: #0B7A5C">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">I'm 18 or older</span><span style="font-size: 13px; line-height: 18px; color: #5F6672">You need to be 18+ to use HireHop.</span></span>
</label>

<sc-if value="{{adult}}" hint-placeholder-val="{{ false }}">
<a href="S4-Consent.dc.html" style="height: 60px; border-radius: 999px; border: 1.5px solid #16181D; background: #FFFFFF; color: #16181D; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; box-sizing: border-box"><span style="width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #E6E8EC; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800" aria-hidden="true">G</span>Continue with Google</a>
</sc-if>
<sc-if value="{{notAdult}}" hint-placeholder-val="{{ true }}">
<button disabled="disabled" aria-describedby="age-hint" style="height: 60px; border-radius: 999px; border: 1.5px solid #E6E8EC; background: #F6F7F9; color: #5F6672; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px"><span style="width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #E6E8EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800" aria-hidden="true">G</span>Continue with Google</button>
<span id="age-hint" style="margin-top: -6px; text-align: center; font-size: 12px; font-weight: 600; color: #5F6672">Tick the box above to continue</span>
</sc-if>

<p style="margin: 4px 0 0; font-size: 12px; line-height: 18px; color: #5F6672; text-align: center">We only use Google to sign you in. By continuing you agree to the <a href="#" style="font-weight: 700">Terms</a> and <a href="#" style="font-weight: 700">Privacy Notice</a>.</p>
</div>

<a href="S3b-SignIn-Under18.dc.html" style="position: absolute; left: 0; right: 0; bottom: 24px; margin: 0 auto; width: max-content; height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #0B7A5C; text-decoration: none">I'm under 18</a>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { adult: false };
  }
  renderVals() {
    const adult = !!this.state.adult;
    return {
      adult: adult,
      notAdult: !adult,
      toggle: () => this.setState({ adult: !adult })
    };
  }
}
</script>
</body>
</html>
