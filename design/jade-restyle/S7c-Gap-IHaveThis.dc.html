<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S7 Gap check, I have this sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A5C}a:hover{color:#064D3A}
button,input{font-family:inherit}
</style>
</helmet>
<main style="width: 360px; height: 800px; position: relative; overflow: hidden; box-sizing: border-box; background: #FFFFFF; color: #16181D; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 360px; background: #0B7A5C; color: #FFFFFF; border-radius: 0 0 48px 48px; padding: 36px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
<span style="width: 48px; height: 48px; border-radius: 999px; background: #FFFFFF"></span>
<span style="height: 48px; width: 136px; border-radius: 999px; background: #064D3A"></span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF; color: #0B7A5C; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center">KP</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 28px; line-height: 32px; font-weight: 800">Product Analyst</span><span style="font-size: 14px; font-weight: 600; color: #DDF2EA">Kestrel Pay · Bengaluru</span></div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 236px; height: 120px; border-radius: 28px; background: #F6F7F9"></div>
<div style="position: absolute; inset: 0; background: rgba(22, 24, 29, 0.48)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 10px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="width: 40px; height: 4px; border-radius: 999px; background: #E6E8EC; align-self: center"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="sheet-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -0.3px">Do you have this?</h2>
<svg width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><circle cx="6" cy="7" r="3.5" fill="#FFC94D"/><circle cx="20" cy="7" r="3.5" fill="#B94C37"/><circle cx="34" cy="7" r="3.5" fill="#0B7A5C"/></svg>
</div>
<div style="min-height: 48px; border-radius: 24px; background: #F6F7F9; padding: 0 14px; display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#4A5263" stroke-width="2.2" stroke-dasharray="3.2 2.8"/></svg>
<span style="flex: 1; font-size: 15px; font-weight: 700">Design and read A/B tests</span>
<span style="font-size: 12px; font-weight: 700; color: #4A5263">To prepare</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #5F6672">Pick a confirmed fact that shows it, or add a new one. Nothing is used until you confirm it.</p>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Evidence for this requirement</legend>
<sc-for list="{{options}}" as="item" hint-placeholder-count="3">
<label style="min-height: 64px; border-radius: 32px; border: {{item.border}}; background: {{item.bg}}; box-sizing: border-box; padding: 10px 16px 10px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="radio" name="evidence" checked="{{item.selected}}" onChange="{{item.pick}}" style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #0B7A5C">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; line-height: 16px; font-weight: 500; color: #5F6672">{{item.id}}</span>
<span style="font-size: 14px; line-height: 19px; font-weight: 600; color: {{item.ink}}">{{item.text}}</span>
</span>
</label>
</sc-for>
</fieldset>

<div style="display: flex; gap: 10px; align-items: center; margin-top: 2px">
<a href="S7b-Gap-Result.dc.html" aria-label="Close" style="width: 60px; height: 60px; flex: none; border-radius: 999px; border: 1.5px solid #E6E8EC; box-sizing: border-box; background: #F6F7F9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<a href="S7b-Gap-Result.dc.html" style="flex: 1; height: 60px; border-radius: 999px; background: #0B7A5C; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">{{cta}}</a>
</div>
</div>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'F-03' };
  }
  renderVals() {
    const picked = this.state.picked || 'F-03';
    const raw = [
      { id: 'F-03', text: 'Ran an SMS reminder pilot that cut missed appointments by 18%' },
      { id: 'F-02', text: 'Built weekly SQL reports on clinic wait times' },
      { id: 'New fact', text: 'Add a new fact and confirm it' }
    ];
    const options = raw.map((o) => {
      const on = o.id === picked;
      return {
        id: o.id,
        text: o.text,
        selected: on,
        border: on ? '2px solid #0B7A5C' : '1.5px solid #E6E8EC',
        bg: on ? '#DDF2EA' : '#FFFFFF',
        ink: on ? '#064D3A' : '#16181D',
        pick: () => this.setState({ picked: o.id })
      };
    });
    return {
      options: options,
      cta: picked === 'New fact' ? 'Write the fact' : 'Use ' + picked
    };
  }
}
</script>
</body>
</html>
