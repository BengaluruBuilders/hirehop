name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: "PR title"
    runs-on: [self-hosted, Linux, bengaluru-vm]
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Constitution VI.2::Use the PR title format type(scope): summary"
            exit 1
          fi
