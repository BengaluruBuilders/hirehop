name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: build-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: "Constitution policy"
    runs-on: [self-hosted, Linux, bengaluru-vm]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Constitution VI.2::Use the PR title format type(scope): summary"
            exit 1
          fi

      - name: Checkout
        if: github.event.action != 'edited'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check constitution rules
        if: github.event.action != 'edited'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: tools/ci/check-constitution.sh

      - name: Scan for secrets
        if: github.event.action != 'edited'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: "Detect code changes"
    if: github.event.action != 'edited'
    runs-on: [self-hosted, Linux, bengaluru-vm]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find changed code files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_files="$(git diff --name-only HEAD^1 HEAD | grep -vE '^(docs|design)/|\.md$' || true)"
          if [[ -n "$code_files" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::This PR changes only docs, design, or Markdown files."
          fi

  build:
    name: "Build, lint, and unit tests"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, bengaluru-vm, android-build, android-sdk-36]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Check, test, lint, and build APKs
        run: >-
          ./gradlew
          :build-logic:convention:check
          spotlessCheck
          testDebugUnitTest
          :app:testDemoDebugUnitTest
          :app:testProdDebugUnitTest
          :core:domain:koverVerify
          :core:data:koverVerify
          verifyRoborazziDebug
          lintRelease
          :app:lintDemoRelease
          :app:lintProdRelease
          assembleDebug
          assembleRelease
          :app:dependencyGuard
          -PwarningsAsErrors=true
          --continue

      - name: Check Room schema is committed
        run: |
          if [[ -n "$(git status --porcelain -- core/database/schemas)" ]]; then
            git status --short -- core/database/schemas
            echo "::error title=Constitution V.6::Room schema changed. Commit the exported schema and add a migration."
            exit 1
          fi

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          retention-days: 7
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/outputs/roborazzi/
            **/build/test-results/
